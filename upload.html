<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ગીત અપલોડ</title>
<style>
:root{--bg:#14101f;--card:#211a36;--ac:#f2b544;--tx:#f4efe6;--mu:#a99fc0;--ok:#6fd49a;--er:#ff7a8a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Gujarati",sans-serif;padding:20px 16px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h1{font-size:22px;margin-bottom:14px}
button{font:inherit;border:0;border-radius:12px;padding:14px;cursor:pointer}
#pick{width:100%;background:var(--card);color:var(--tx);border:2px dashed #ffffff33;font-size:16px}
#go{width:100%;margin-top:12px;background:var(--ac);color:#14101f;font-weight:700;font-size:16px}
#go:disabled{opacity:.45}
input[type=file]{display:none}
.item{background:var(--card);border-radius:12px;padding:12px;margin-top:10px}
.item input{width:100%;background:transparent;border:0;border-bottom:1px solid #ffffff22;color:var(--tx);font:inherit;padding:4px 0 8px}
.bar{height:6px;background:#ffffff1a;border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac)}
.st{font-size:12px;color:var(--mu);margin-top:6px}
.ok{color:var(--ok)}.er{color:var(--er)}
#sum{margin-top:14px;color:var(--mu);font-size:14px}
</style>
</head>
<body>
<h1>ગીત અપલોડ કરો</h1>
<button id="pick">+ ગીતો પસંદ કરો (એક સાથે ઘણા)</button>
<input type="file" id="file" accept="audio/*" multiple>
<div id="items"></div>
<button id="go" disabled>અપલોડ શરૂ કરો</button>
<div id="sum"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref as dref,get,push,set} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import {getStorage,ref as sref,uploadBytesResumable,getDownloadURL} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const app=initializeApp({
  apiKey:"AIzaSyC0RtJmMYwO45OjacHnpcv298DRBOOz1E0",
  authDomain:"naitri-a5975.firebaseapp.com",
  databaseURL:"https://naitri-a5975-default-rtdb.firebaseio.com",
  projectId:"naitri-a5975",
  storageBucket:"naitri-a5975.firebasestorage.app",
  messagingSenderId:"414479436661",
  appId:"1:414479436661:web:b1f66ea5b3844abfb2a13c"
});
const db=getDatabase(app), st=getStorage(app);
const $=id=>document.getElementById(id);
let files=[];

$("pick").onclick=()=>$("file").click();
$("file").onchange=()=>{
  files=[...$("file").files];
  $("items").innerHTML=files.map((f,i)=>`<div class="item"><input id="t${i}" value="${f.name.replace(/\.[^.]+$/,"").replace(/"/g,"&quot;")}"><div class="bar"><i id="b${i}"></i></div><div class="st" id="s${i}">${(f.size/1048576).toFixed(1)} MB</div></div>`).join("");
  $("go").disabled=!files.length;
  $("sum").textContent=files.length?files.length+" ગીત પસંદ કર્યા":"";
};

$("go").onclick=async()=>{
  $("go").disabled=true;$("pick").disabled=true;
  let base=0;
  try{const s=await get(dref(db,"songs"));base=s.exists()?Object.keys(s.val()).length:0}catch(_){}
  let done=0,fail=0;
  await Promise.all(files.map((f,i)=>new Promise(res=>{
    const title=$("t"+i).value.trim()||f.name;
    const path="songs/"+Date.now()+"_"+i+"_"+f.name.replace(/[^\w.\-]/g,"_");
    const task=uploadBytesResumable(sref(st,path),f,{contentType:f.type||"audio/mpeg",cacheControl:"public,max-age=31536000"});
    const t0=Date.now();
    task.on("state_changed",x=>{
      $("b"+i).style.width=(x.bytesTransferred/x.totalBytes*100)+"%";
      $("s"+i).textContent=Math.round(x.bytesTransferred/x.totalBytes*100)+"% · "+(x.bytesTransferred/1048576/((Date.now()-t0)/1000)).toFixed(1)+" MB/s";
    },err=>{fail++;$("s"+i).className="st er";$("s"+i).textContent="ન થયું: "+err.message;res()},
    async()=>{
      try{
        const url=await getDownloadURL(task.snapshot.ref);
        await set(push(dref(db,"songs")),{title,url,path,order:base+i,createdAt:Date.now()});
        done++;$("s"+i).className="st ok";$("s"+i).textContent="✓ અપલોડ થયું";
      }catch(e){fail++;$("s"+i).className="st er";$("s"+i).textContent="ન થયું: "+e.message}
      res();
    });
  })));
  $("sum").textContent="✓ "+done+" થયા"+(fail?", "+fail+" ન થયા":"");
  $("pick").disabled=false;
};
</script>
</body>
</html>
