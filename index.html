<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Naitri Music</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14101f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#14101f;--card:#211a36;--ac:#f2b544;--tx:#f4efe6;--mu:#a99fc0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Gujarati",sans-serif;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #ffffff14}
#top img{width:32px;height:32px;border-radius:8px}
#top b{font-size:17px}
img.cover{border-radius:22%;background:none;object-fit:cover}
.tab{display:none;flex:1;min-height:0;flex-direction:column}
.tab.on{display:flex}
#pager{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
#pager::-webkit-scrollbar{display:none}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center}
.cover{width:min(68vw,300px);aspect-ratio:1;border-radius:50%;background:conic-gradient(from 200deg,#f2b544,#c8485a,#4a2f7a,#f2b544);display:grid;place-items:center;font-size:70px;box-shadow:0 20px 50px #0008}
.slide h2{font-size:22px;max-width:90%;overflow-wrap:anywhere}
.slide p{color:var(--mu);font-size:13px}
#ctrl{padding:8px 24px 14px}
#seek{width:100%;accent-color:var(--ac)}
.times{display:flex;justify-content:space-between;color:var(--mu);font-size:12px}
.btns{display:flex;justify-content:center;align-items:center;gap:28px;margin-top:6px}
.btns button{font-size:28px;padding:8px}
#pp{background:var(--ac);color:#14101f;width:64px;height:64px;border-radius:50%;font-size:26px}
#mini{display:none;align-items:center;gap:12px;padding:8px 14px;background:var(--card);border-top:1px solid #ffffff14}
#mini.show{display:flex}
#mini .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
#mini button{font-size:22px;padding:6px 10px}
.head{padding:16px 18px 8px;font-size:20px;font-weight:700}
.list{flex:1;overflow-y:auto;padding:0 10px 10px}
.row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px}
.row.cur{background:var(--card)}
.row .n{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}
.row.cur .n{background:var(--ac);color:#14101f}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row button.i{padding:6px 9px;font-size:18px}
.empty{color:var(--mu);text-align:center;padding:40px 20px}
.form{padding:0 18px 12px;display:grid;gap:10px}
.form input[type=text]{background:var(--card);border:1px solid #ffffff1f;border-radius:10px;padding:12px;color:var(--tx);font:inherit}
.form input[type=file]{color:var(--mu);font-size:14px}
.go{background:var(--ac);color:#14101f;font-weight:700;border-radius:10px;padding:12px}
.go:disabled{opacity:.5}
#msg{color:var(--mu);font-size:13px;min-height:18px}
nav{display:flex;background:#0d0a16;border-top:1px solid #ffffff14;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0 9px;color:var(--mu);font-size:12px;display:grid;gap:2px;justify-items:center}
nav button span{font-size:20px}
nav button.on{color:var(--ac)}
</style>
</head>
<body>
<header id="top"><img src="icon-192.png" alt="Naitri Music"><b>Naitri Music</b></header>

<section class="tab on" id="home">
  <div id="pager"></div>
  <div id="ctrl">
    <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
    <div class="times"><span id="tc">0:00</span><span id="td">0:00</span></div>
    <div class="btns">
      <button id="prev" aria-label="પાછળનું">⏮</button>
      <button id="pp" aria-label="પ્લે">▶</button>
      <button id="next" aria-label="આગળનું">⏭</button>
    </div>
  </div>
</section>

<section class="tab" id="songs">
  <div class="head">બધાં ગીતો</div>
  <div class="list" id="allList"></div>
</section>

<section class="tab" id="manage">
  <div class="head">ગીત અપલોડ કરો</div>
  <div class="form">
    <input type="text" id="title" placeholder="ગીતનું નામ (એક ફાઇલ હોય તો)">
    <input type="file" id="file" accept="audio/*" multiple>
    <button class="go" id="up">અપલોડ કરો</button>
    <div id="msg"></div>
  </div>
  <div class="head" style="font-size:16px">ગોઠવણી</div>
  <div class="list" id="manList"></div>
</section>

<div id="mini"><img src="icon-192.png" alt="" style="width:34px;height:34px;border-radius:8px"><div class="t" id="mt"></div><button id="mpp">▶</button><button id="mnext">⏭</button></div>

<nav>
  <button data-t="home" class="on"><span>🏠</span>હોમ</button>
  <button data-t="songs"><span>🎵</span>ગીતો</button>
  <button data-t="manage"><span>⬆️</span>અપલોડ</button>
</nav>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref as dref,onValue,push,set,remove,update} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import {getStorage,ref as sref,uploadBytesResumable,getDownloadURL,deleteObject} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const app=initializeApp({
  apiKey:"AIzaSyC0RtJmMYwO45OjacHnpcv298DRBOOz1E0",
  authDomain:"naitri-a5975.firebaseapp.com",
  databaseURL:"https://naitri-a5975-default-rtdb.firebaseio.com",
  projectId:"naitri-a5975",
  storageBucket:"naitri-a5975.firebasestorage.app",
  messagingSenderId:"414479436661",
  appId:"1:414479436661:web:b1f66ea5b3844abfb2a13c"
});
const db=getDatabase(app), st=getStorage(app);
const $=id=>document.getElementById(id);
const audio=new Audio(); audio.preload="auto";
const pre=new Audio(); pre.preload="auto";   // next song loads quietly in advance
let songs=[], cur=-1, curId=null, lock=false, tm, sig="", seeking=false;

const fmt=s=>isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Install as app + offline shell */
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

/* Tabs */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.t));
function show(t){
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.id===t));
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.t===t));
  ui();
  if(t==="home")scrollPager(false);
}
$("mini").onclick=e=>{if(!e.target.closest("button"))show("home")};

/* Data */
onValue(dref(db,"songs"),snap=>{
  const v=snap.val()||{};
  songs=Object.entries(v).map(([id,x])=>({id,...x})).sort((a,b)=>(a.order||0)-(b.order||0));
  cur=songs.findIndex(s=>s.id===curId);
  if(cur<0&&curId){curId=null;audio.pause();}
  render();
},err=>{$("allList").innerHTML='<div class="empty">ડેટા લોડ ન થયો: '+esc(err.message)+'</div>'});

function render(){
  // pager is rebuilt only when the song list really changes (keeps scrolling smooth)
  const sg=songs.map(s=>s.id+s.title).join("|");
  if(sg!==sig){
    sig=sg;
    $("pager").innerHTML=songs.length?songs.map(s=>`<div class="slide"><img class="cover" src="icon-512.png" alt=""><h2>${esc(s.title)}</h2><p>નીચે સ્ક્રોલ કરો, આગળનું ગીત વાગશે</p></div>`).join(""):'<div class="slide"><div class="empty">હજી કોઈ ગીત નથી. અપલોડ ટેબમાંથી ઉમેરો.</div></div>';
    scrollPager(false);
  }
  $("allList").innerHTML=songs.length?songs.map((s,i)=>`<div class="row ${i===cur?"cur":""}" data-i="${i}"><div class="n">${i===cur&&!audio.paused?"♫":i+1}</div><div class="t">${esc(s.title)}</div></div>`).join(""):'<div class="empty">કોઈ ગીત નથી</div>';
  $("manList").innerHTML=songs.map((s,i)=>`<div class="row"><div class="t">${esc(s.title)}</div><button class="i" data-a="up" data-i="${i}">▲</button><button class="i" data-a="dn" data-i="${i}">▼</button><button class="i" data-a="del" data-i="${i}">🗑</button></div>`).join("");
  ui();
}
function updateCur(){
  document.querySelectorAll("#allList .row").forEach((r,i)=>{
    r.classList.toggle("cur",i===cur);
    r.querySelector(".n").textContent=i===cur&&!audio.paused?"♫":i+1;
  });
}
$("allList").onclick=e=>{const r=e.target.closest(".row");if(r){play(+r.dataset.i);show("home")}};
$("manList").onclick=async e=>{
  const b=e.target.closest("button");if(!b)return;
  const i=+b.dataset.i,a=b.dataset.a,s=songs[i];
  if(a==="del"){
    if(!confirm("'"+s.title+"' કાઢી નાખવું?"))return;
    try{if(s.path)await deleteObject(sref(st,s.path))}catch(_){}
    await remove(dref(db,"songs/"+s.id));
  }else{
    const j=a==="up"?i-1:i+1; if(j<0||j>=songs.length)return;
    const u={};
    songs.forEach((x,k)=>{u[x.id+"/order"]=k});
    u[s.id+"/order"]=j; u[songs[j].id+"/order"]=i;
    await update(dref(db,"songs"),u);
  }
};

/* Playback */
function play(i){
  if(i<0||i>=songs.length)return;
  cur=i;curId=songs[i].id;
  audio.src=songs[i].url;
  audio.play().catch(()=>{});
  scrollPager(true);updateCur();ui();meta();preloadNext();
}
function preloadNext(){
  if(songs.length<2)return;
  pre.src=songs[(cur+1)%songs.length].url; pre.load();
}
function toggle(){ if(cur<0){play(0);return} audio.paused?audio.play():audio.pause() }
const nextSong=()=>songs.length&&play((cur+1)%songs.length);
const prevSong=()=>{ if(audio.currentTime>3){audio.currentTime=0;return} songs.length&&play((cur-1+songs.length)%songs.length) };
$("pp").onclick=$("mpp").onclick=toggle;
$("next").onclick=$("mnext").onclick=nextSong;
$("prev").onclick=prevSong;
audio.onended=nextSong;
["play","pause"].forEach(ev=>audio.addEventListener(ev,()=>{ui();updateCur()}));
audio.ontimeupdate=()=>{
  if(!seeking)$("seek").value=audio.duration?audio.currentTime/audio.duration*100:0;
  $("tc").textContent=fmt(audio.currentTime);$("td").textContent=fmt(audio.duration);
};
$("seek").oninput=()=>{seeking=true;$("tc").textContent=fmt($("seek").value/100*audio.duration)};
$("seek").onchange=()=>{if(audio.duration)audio.currentTime=$("seek").value/100*audio.duration;seeking=false};
function ui(){
  const p=!audio.paused;
  $("pp").textContent=$("mpp").textContent=p?"⏸":"▶";
  $("mt").textContent=cur>=0&&songs[cur]?songs[cur].title:"";
  $("mini").classList.toggle("show",!$("home").classList.contains("on")&&cur>=0);
  if("mediaSession"in navigator)navigator.mediaSession.playbackState=p?"playing":"paused";
}

/* Scroll = next / previous song */
function scrollPager(smooth){
  const p=$("pager");if(cur<0||!p.clientHeight)return;
  lock=true;
  p.scrollTo({top:cur*p.clientHeight,behavior:smooth?"smooth":"auto"});
  setTimeout(()=>lock=false,smooth?600:80);
}
$("pager").addEventListener("scroll",()=>{
  if(lock)return;
  clearTimeout(tm);
  tm=setTimeout(()=>{
    const p=$("pager"),i=Math.round(p.scrollTop/p.clientHeight);
    if(i!==cur&&i>=0&&i<songs.length)play(i);
  },140);
});

/* Lock-screen / background controls */
function meta(){
  if(!("mediaSession"in navigator)||cur<0)return;
  navigator.mediaSession.metadata=new MediaMetadata({title:songs[cur].title,artist:"Naitri Music"});
}
if("mediaSession"in navigator){
  const m=navigator.mediaSession;
  m.setActionHandler("play",()=>audio.play());
  m.setActionHandler("pause",()=>audio.pause());
  m.setActionHandler("nexttrack",nextSong);
  m.setActionHandler("previoustrack",prevSong);
  m.setActionHandler("seekto",d=>{audio.currentTime=d.seekTime});
}

/* Upload: many files at once, in parallel, with speed shown */
$("up").onclick=async()=>{
  const files=[...$("file").files],msg=$("msg");
  if(!files.length){msg.textContent="પહેલા ઓડિયો ફાઇલ પસંદ કરો";return}
  $("up").disabled=true;
  const prog=files.map(()=>0),tot=files.reduce((a,f)=>a+f.size,0),base=songs.length,t0=Date.now();
  const showP=()=>{
    const d=prog.reduce((a,b)=>a+b,0);
    msg.textContent="અપલોડ થઈ રહ્યું છે… "+Math.round(d/tot*100)+"% ("+(d/1048576/((Date.now()-t0)/1000)).toFixed(1)+" MB/s)";
  };
  try{
    await Promise.all(files.map((f,i)=>new Promise((res,rej)=>{
      const title=(files.length===1&&$("title").value.trim())||f.name.replace(/\.[^.]+$/,"");
      const path="songs/"+Date.now()+"_"+i+"_"+f.name.replace(/[^\w.\-]/g,"_");
      const task=uploadBytesResumable(sref(st,path),f,{contentType:f.type||"audio/mpeg",cacheControl:"public,max-age=31536000"});
      task.on("state_changed",x=>{prog[i]=x.bytesTransferred;showP()},rej,async()=>{
        try{
          const url=await getDownloadURL(task.snapshot.ref);
          await set(push(dref(db,"songs")),{title,url,path,order:base+i,createdAt:Date.now()});
          res();
        }catch(e){rej(e)}
      });
    })));
    msg.textContent="✓ "+files.length+" ગીત ઉમેરાયા";
    $("title").value="";$("file").value="";
  }catch(e){msg.textContent="અપલોડ ન થયું: "+e.message}
  $("up").disabled=false;
};
</script>
</body>
</html>
